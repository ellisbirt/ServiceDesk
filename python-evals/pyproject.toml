[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "promptevals"
version = "0.1.0"
description = "Provider-independent LLM eval framework: generate cases, run, grade, compare."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0",
    "openai>=1.0",
]

[project.optional-dependencies]
schema = ["jsonschema>=4"]
notebook = ["jupyterlab>=4", "pandas>=2", "matplotlib>=3.8"]
dev = ["pytest>=8", "jsonschema>=4"]

[project.scripts]
promptevals = "promptevals.cli:main"

[tool.setuptools.packages.find]
include = ["promptevals*", "service_desk_evals*"]

[tool.setuptools.package-data]
promptevals = ["report/*.mjs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
